<h1 id="code-fences">Code fences</h1>
<p>Squero leaves fences inside code alone:</p>
<pre><code class="language-markdown">::: +note
not a fence
:::
</code></pre>
<pre><code>::: ?broken[
</code></pre>
<pre><code>::: indented code is not a fence either
</code></pre>
<div class="after">
<p>A real fence after the code.</p>
</div>
