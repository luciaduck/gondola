<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="1">
<title>Gondola SSG v0.0.1</title>
<style>
:root {
  --background: #f3eee4;
  --text: #1f2a30;
  --muted: #55626a;
  --heading: #1d5c63;
  --link: #1d5c63;
}
.failed {
  --heading: #9b2226;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #14191c;
    --text: #e6e1d6;
    --muted: #a3aeb4;
    --heading: #7cc4c9;
    --link: #7cc4c9;
  }
  .failed {
    --heading: #f08a8c;
  }
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
main {
  max-width: 40rem;
  margin: 0 auto;
  padding: 2rem 1rem;
}
h1 {
  margin: 0 0 0.5rem;
  color: var(--heading);
  font-size: 1.75rem;
  line-height: 1.2;
}
.lead {
  font-size: 1.15rem;
  font-weight: 600;
}
figure {
  margin: 1.5rem 0 0;
}
img {
  display: block;
  max-width: 100%;
  max-height: 70vh;
  width: auto;
  height: auto;
  margin: 0 auto;
  border-radius: 0.5rem;
}
figcaption {
  margin-top: 0.5rem;
  color: var(--muted);
  font-size: 0.85rem;
  text-align: center;
}
a {
  color: var(--link);
}
</style>
</head>
<body class="building">
<main>
<h1>Your site is being shipped with Gondola.</h1>
<p>Enjoy the view while the build runs.</p>
<figure>
<img src="data:image/jpeg;base64,…" alt="A gondolier in a striped shirt and straw hat rows a black gondola with red seats down the Grand Canal in Venice, between old palaces under a blue sky." width="960" height="1248">
<figcaption>Photo: <a href="https://commons.wikimedia.org/wiki/File:Venice_Gondola_Grand_Canal.jpg">“Venice Gondola Grand Canal”</a> by Saffron Blaze, <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>, via Wikimedia Commons.</figcaption>
</figure>
</main>
</body>
</html>
