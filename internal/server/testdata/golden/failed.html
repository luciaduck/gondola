<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="2">
<title>Gondola SSG v0.0.1</title>
<style>
:root {
  --background: #f3eee4;
  --text: #1f2a30;
  --muted: #55626a;
  --heading: #1d5c63;
  --link: #1d5c63;
}
.failed {
  --heading: #9b2226;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #14191c;
    --text: #e6e1d6;
    --muted: #a3aeb4;
    --heading: #7cc4c9;
    --link: #7cc4c9;
  }
  .failed {
    --heading: #f08a8c;
  }
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
main {
  max-width: 40rem;
  margin: 0 auto;
  padding: 2rem 1rem;
}
h1 {
  margin: 0 0 0.5rem;
  color: var(--heading);
  font-size: 1.75rem;
  line-height: 1.2;
}
.lead {
  font-size: 1.15rem;
  font-weight: 600;
}
figure {
  margin: 1.5rem 0 0;
}
img {
  display: block;
  max-width: 100%;
  max-height: 70vh;
  width: auto;
  height: auto;
  margin: 0 auto;
  border-radius: 0.5rem;
}
figcaption {
  margin-top: 0.5rem;
  color: var(--muted);
  font-size: 0.85rem;
  text-align: center;
}
a {
  color: var(--link);
}
</style>
</head>
<body class="failed">
<main>
<h1>Build failed</h1>
<p class="lead">Aground on the barene.</p>
<p>The gondola ran onto the salt marshes of the lagoon: the last build failed. The errors are in the terminal; fix them, then type g and Enter.</p>
<figure>
<img src="data:image/jpeg;base64,…" alt="Low salt marshes in the Venetian lagoon in the late afternoon: tufts of grass rise from still, shallow water that reflects the sun." width="500" height="375">
<figcaption>Photo: <a href="https://commons.wikimedia.org/wiki/File:Barena_bassa_Saccagnana.jpg">“Barena bassa Saccagnana”</a> by AlbertoMara, <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>, via Wikimedia Commons.</figcaption>
</figure>
</main>
</body>
</html>
