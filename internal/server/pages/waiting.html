<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="{{.RefreshSeconds}}">
<title>{{.Title}}</title>
<style>
:root {
  --background: #f3eee4;
  --text: #1f2a30;
  --muted: #55626a;
  --heading: #1d5c63;
  --link: #1d5c63;
}
.failed {
  --heading: #9b2226;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #14191c;
    --text: #e6e1d6;
    --muted: #a3aeb4;
    --heading: #7cc4c9;
    --link: #7cc4c9;
  }
  .failed {
    --heading: #f08a8c;
  }
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
main {
  max-width: 40rem;
  margin: 0 auto;
  padding: 2rem 1rem;
}
h1 {
  margin: 0 0 0.5rem;
  color: var(--heading);
  font-size: 1.75rem;
  line-height: 1.2;
}
.lead {
  font-size: 1.15rem;
  font-weight: 600;
}
figure {
  margin: 1.5rem 0 0;
}
img {
  display: block;
  max-width: 100%;
  max-height: 70vh;
  width: auto;
  height: auto;
  margin: 0 auto;
  border-radius: 0.5rem;
}
figcaption {
  margin-top: 0.5rem;
  color: var(--muted);
  font-size: 0.85rem;
  text-align: center;
}
a {
  color: var(--link);
}
</style>
</head>
<body class="{{.Kind}}">
<main>
<h1>{{.Heading}}</h1>
{{- if .Lead}}
<p class="lead">{{.Lead}}</p>
{{- end}}
<p>{{.Text}}</p>
<figure>
<img {{.Photo.SourceAttribute}} alt="{{.Photo.Alt}}" width="{{.Photo.Width}}" height="{{.Photo.Height}}">
<figcaption>Photo: <a href="{{.Photo.CommonsURL}}">“{{.Photo.Title}}”</a> by {{.Photo.Author}}, <a href="{{.Photo.LicenseURL}}">{{.Photo.LicenseName}}</a>, via Wikimedia Commons.</figcaption>
</figure>
</main>
</body>
</html>
