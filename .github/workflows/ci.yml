
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Oldest supported Go and newest release.
        go: [go.mod, stable]
        # macOS minutes count ten times in a private repository; the oldest
        # Go is tested on the other two systems.
        exclude:
          - os: macos-latest
            go: go.mod
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Pinned: the golden CSS files depend on its formatting. Update both together.
      SASS_VERSION: 1.106.1
      SASS_SHA256_LINUX: ad99cccb90de4ad2926e03e32d819c83baf32c3dbff56da92df0eed10e604d60
      SASS_SHA256_WINDOWS: a6e5bf97187af4a175279eabb6316af597d6e4b06ec2099ae961dc553655d8e1
      # macos-latest runs on Apple silicon.
      SASS_SHA256_MACOS: 8a54a73d611abf47524c736761172a4efa7bc06081ee2b4131fd0c141d213a20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # An empty input counts as unset.
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}

      # Not npm's sass: it has no --embedded mode.
      - name: Install Dart Sass (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            platform=macos-arm64 checksum="$SASS_SHA256_MACOS"
          else
            platform=linux-x64 checksum="$SASS_SHA256_LINUX"
          fi
          archive="dart-sass-${SASS_VERSION}-${platform}.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/${archive}"
          # shasum is on both systems; macOS has no sha256sum.
          echo "${checksum}  $RUNNER_TEMP/$archive" | shasum --algorithm 256 --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Install Dart Sass (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "dart-sass-$env:SASS_VERSION-windows-x64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          Invoke-WebRequest -Uri "https://github.com/sass/dart-sass/releases/download/$env:SASS_VERSION/$archive" -OutFile $archivePath
          if ((Get-FileHash $archivePath -Algorithm SHA256).Hash -ne $env:SASS_SHA256_WINDOWS) { throw "checksum mismatch for $archive" }
          Expand-Archive $archivePath -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP 'dart-sass')

      # The Sass tests skip silently when sass is missing. PowerShell finds
      # sass.bat on Windows, as Gondola does.
      - name: Check Dart Sass
        shell: pwsh
        run: |
          $installed = sass --version
          if ($installed -ne $env:SASS_VERSION) { throw "expected Dart Sass $env:SASS_VERSION, found: $installed" }

      # The source is the same on every system: checked once, on Linux.
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # See CLAUDE.md. grep exits 1 for no match, 2 for an error.
      - name: Invisible characters in Go source
        if: runner.os == 'Linux'
        run: |
          status=0
          grep -rnP '[\x{0085}\x{2028}\x{2029}\x{FEFF}]' --include='*.go' . || status=$?
          case "$status" in
            0) echo "write these characters as escapes, such as \"\\u2028\""; exit 1 ;;
            1) ;;
            *) exit "$status" ;;
          esac

      - name: go vet
        run: go vet ./...

      # -race needs a C compiler, which the Windows runner is not sure to have.
      - name: go test
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} ./...
